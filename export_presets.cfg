; Fichero de exportacion de **Desbrozadora**. Se versiona a proposito: es
; configuracion del proyecto, no un binario, y sin el no se puede exportar.
;
; **Solo plataformas de escritorio.** En Android e iOS este mismo fichero
; lleva dentro las claves de firma y sus contrasenas. Si algun dia se anaden
; esas plataformas, hay que sacar este fichero del repositorio ANTES de
; exportar, no despues de exportar y antes de subir.
;
; Escribido a mano, no desde el exportador, y verificado exportando. Escrito a
; mano con solo las claves que cambian el resultado, para que si algo falla se
; sepa cual es en vez de tener cincuenta lineas de valores por defecto.

[preset.0]

name="Linux"
platform="Linux"
runnable=true
dedicated_server=false
advanced_options=false
custom_features=""
; `all_resources` mete en el paquete todo lo que Godot reconoce como recurso.
export_filter="all_resources"
include_filter=""
; Los 30 PNG de `capturas/` pesan 23 MB y Godot los importa como texturas de
; 762 KB cada uno. Sin esta linea el ejecutable lleva dentro las capturas de las
; pruebas de medicion que se hicieron para ajustar la maleza. El juego en si son
; 1,9 MB.
;
; `tools/` son 18 scripts de prueba y 12 de Python que el juego no usa: nada de
; `scenes/` los referencia. `docs/` y los `.md` son documentacion.
;
; `models/furgoneta.glb` tambien, y este es el que cuelga: son 269 KB, el 69 % de
; todo el contenido del juego, y **ninguna escena lo referencia**. No lo quita
; el `.gitignore` porque el exportador lee el disco y no git, asi que un clon
; limpio y esta carpeta producirian dos ejecutables distintos con el mismo
; codigo. La furgoneta se importa con la conduccion, y entonces sale de aqui.
exclude_filter="capturas/*,tools/*,docs/*,*.md,models/furgoneta.glb"
export_path="build/desbrozadora.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
; 0 = texto, 1 = binario, 2 = binario comprimido. Sin esto el paquete lleva el
; codigo fuente legible de los 40 scripts.
script_export_mode=2

[preset.0.options]

; Un solo fichero en vez de ejecutable y `.pck` suelto. Para quien se lo baja
; no hay diferencia entre que funcione y que no.
binary_format/embed_pck=true
binary_format/architecture="x86_64"
; Sin simbolos de depuracion. Es lo unico que el exportador anade por su cuenta
; y no lo usa nadie.
debug/export_release_debug_level=0
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false

[preset.1]

name="Windows"
platform="Windows Desktop"
runnable=true
dedicated_server=false
advanced_options=false
custom_features=""
export_filter="all_resources"
include_filter=""
; Los mismos filtros que el preset de Linux. Se repiten en vez de referenciarlos
; porque el exportador no hereda nada de un preset a otro.
exclude_filter="capturas/*,tools/*,docs/*,*.md,models/furgoneta.glb"
export_path="build/desbrozadora.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

; Tambien embebido, por el mismo motivo que en Linux: si el `.pck` va suelto al
; lado, es la causa clasica de "lo he descargado y no me arranca".
binary_format/embed_pck=true
binary_format/architecture="x86_64"
debug/export_release_debug_level=0
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
; Sin esto el exportador intenta reescribir el icono y la version dentro del
; `.exe`, y para eso necesita `rcedit` instalado en el sistema, que no lo
; tenemos: la exportacion falla con un error que no habla del preset.
application/modify_resources=false
